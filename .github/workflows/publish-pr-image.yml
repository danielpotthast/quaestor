name: Publish PR image

# PR pipelines (possibly from forks) have no write access, so they only upload their image as an artifact and this
# workflow pushes it as pr-<number>.

on:
  workflow_run:
    workflows: [ Pipeline that builds and releases the container image ]
    types: [ completed ]

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  publish:
    if: >-
      github.event.workflow_run.event == 'pull_request'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.actor.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      packages: write
      pull-requests: read
    steps:
      - name: Resolve PR number
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          number=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/pulls" \
            --jq 'map(select(.state == "open")) | first | .number // empty')
          if [[ -z "${number}" ]]; then
            echo "::error::No open PR found for commit ${HEAD_SHA}"
            exit 1
          fi
          echo "PR: #${number}"
          echo "number=${number}" >> "$GITHUB_OUTPUT"

      - name: Download images
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: image-*
          path: ${{ runner.temp }}/images
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push images and merge them under pr-<number>
        working-directory: ${{ runner.temp }}/images
        env:
          TAG: ${{ env.IMAGE_NAME }}:pr-${{ steps.pr.outputs.number }}
        run: |
          sources=()
          for pair in linux-amd64 linux-arm64; do
            skopeo copy --all "oci-archive:image-${pair}/image.tar" "docker://${TAG}-${pair}"
            sources+=("${TAG}-${pair}")
          done
          docker buildx imagetools create -t "${TAG}" "${sources[@]}"
